name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore ManyWinters.sln

      - name: Check formatting (lint)
        run: dotnet format ManyWinters.sln --verify-no-changes --severity warn

      - name: Build (analyzers run as part of build)
        run: dotnet build ManyWinters.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test ManyWinters.sln --no-build --configuration Release --verbosity normal

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      # Buildless extraction, which is what GitHub's own default setup uses for C#. It needs no
      # Autobuild step, and it's the only mode overlay (incremental) analysis works with, so it
      # also silences the "cannot build an overlay-base database" notice on every run. Source
      # generators don't run under it, so Godot.NET.Sdk's generated files drop out of the
      # analysis - which is the wanted outcome, they were never ours to fix.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4

  # Only pushes that touch the shipped game are worth a new build. Changes to tests,
  # tools, art scripts or docs still run the full CI above, they just don't cut a release.
  check-game-changes:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check whether shipped files changed
        id: filter
        run: |
          before="${{ github.event.before }}"
          # New branch, force-push or rewritten history: don't be clever, just build.
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$before" "${{ github.sha }}" \
            | grep -qE '^(src/ManyWinters\.(Core|Godot)/|Directory\.Build\.props$|ManyWinters\.sln$|\.github/workflows/)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: [build-and-test, check-game-changes]
    if: needs.check-game-changes.outputs.changed == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      GODOT_RELEASE: 4.7.1-stable
      GODOT_TEMPLATE_DIR: 4.7.1.stable.mono
      GODOT_EDITOR_SETTINGS: editor_settings-4.7.tres
      EXPORT_PRESET: Of Folks and Many Winters
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      # Godot's export shells out to `dotnet publish` for a self-contained win-x64 build, which
      # pulls the .NET runtime packs - a cold restore fetches around 311 MB. No lock files exist,
      # so the key hashes the project files instead; restore-keys let an unrelated .csproj edit
      # still reuse the previous cache rather than starting from empty.
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-

      - name: Compute version
        id: version
        run: |
          $v = "0.1.${{ github.run_number }}"
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=v$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Cache Godot editor and export templates
        id: godot-cache
        uses: actions/cache@v6
        with:
          path: |
            tools/godot
            ~/AppData/Roaming/Godot/export_templates
          # Bump the trailing suffix whenever the trim rules in the next step change: the key does
          # not otherwise depend on them, so a cache saved under the old rules would be reused
          # silently and show up as a mysterious export failure.
          key: godot-${{ env.GODOT_RELEASE }}-mono-win64-v1

      - name: Download Godot editor and export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          $ErrorActionPreference = "Stop"
          $base = "https://github.com/godotengine/godot/releases/download/$env:GODOT_RELEASE"
          New-Item -ItemType Directory -Force tools/godot | Out-Null

          Invoke-WebRequest "$base/Godot_v${env:GODOT_RELEASE}_mono_win64.zip" -OutFile godot.zip
          Expand-Archive godot.zip -DestinationPath tools/godot

          # The template archive is a plain zip with a .tpz extension; Expand-Archive insists on .zip.
          Invoke-WebRequest "$base/Godot_v${env:GODOT_RELEASE}_mono_export_templates.tpz" -OutFile templates.zip
          Expand-Archive templates.zip -DestinationPath templates
          $dest = "$env:APPDATA\Godot\export_templates\$env:GODOT_TEMPLATE_DIR"
          New-Item -ItemType Directory -Force $dest | Out-Null
          Move-Item templates/templates/* $dest

          # The archive carries every platform in both debug and release; we only ever export
          # Windows release. Dropping the rest keeps the cache near 100 MB instead of a gigabyte,
          # which is the difference between restoring in seconds and in minutes. The glob also
          # covers the console wrapper template, whose exact name we'd rather not hardcode.
          # icudt_godot.dat is shared ICU data rather than a platform binary, so it stays.
          Get-ChildItem $dest -File | Where-Object {
            $_.Name -notlike "windows_release_x86_64*" -and $_.Name -notin @("version.txt", "icudt_godot.dat")
          } | Remove-Item -Force
          Get-ChildItem $dest -File | ForEach-Object { "kept: {0} ({1:N0} MB)" -f $_.Name, ($_.Length / 1MB) }

      - name: Configure rcedit
        run: |
          $ErrorActionPreference = "Stop"
          # Godot shells out to rcedit to write the icon and version metadata into the .exe.
          # Without it the export still succeeds, just with the stock Godot icon.
          New-Item -ItemType Directory -Force tools | Out-Null
          Invoke-WebRequest "https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe" -OutFile tools/rcedit.exe
          $rcedit = (Resolve-Path tools/rcedit.exe).Path -replace '\\', '/'
          New-Item -ItemType Directory -Force "$env:APPDATA\Godot" | Out-Null
          $settings = @"
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/windows/rcedit = "$rcedit"
          "@
          Set-Content "$env:APPDATA\Godot\$env:GODOT_EDITOR_SETTINGS" $settings -Encoding utf8

      - name: Stamp version
        run: |
          $ErrorActionPreference = "Stop"
          $v = "${{ steps.version.outputs.version }}"
          $presets = "src/ManyWinters.Godot/export_presets.cfg"
          $project = "src/ManyWinters.Godot/project.godot"
          $name = "Of Folks and Many Winters"

          # Windows file metadata wants four components; only the third one ever moves.
          (Get-Content $presets -Raw) `
            -replace 'application/file_version=""', "application/file_version=`"$v.0`"" `
            -replace 'application/product_version=""', "application/product_version=`"$v.0`"" `
            -replace 'application/product_name=""', "application/product_name=`"$name`"" `
            -replace 'application/file_description=""', "application/file_description=`"$name`"" `
            | Set-Content $presets -NoNewline

          # Readable at runtime as ProjectSettings.GetSetting("application/config/version").
          (Get-Content $project -Raw) `
            -replace 'config/name="ManyWinters Godot"', "config/name=`"ManyWinters Godot`"`nconfig/version=`"$v`"" `
            | Set-Content $project -NoNewline

      - name: Import assets
        run: |
          # The console wrapper, not the plain .exe: the latter is a GUI-subsystem binary whose
          # stderr is swallowed on Windows, which turns any export failure into a silent one.
          $godot = (Get-ChildItem tools/godot -Recurse -Filter "Godot_v*_win64_console.exe" |
            Select-Object -First 1).FullName
          if (-not $godot) { throw "Godot console binary not found under tools/godot" }
          "GODOT=$godot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # First headless run builds the .godot/ import cache; a non-zero exit here is normal.
          & $godot --headless --path src/ManyWinters.Godot --import
          "import exit code: $LASTEXITCODE"
          exit 0

      # Empirical, and the mechanism is genuinely not understood: a `dotnet` invocation before
      # the export drops it from ~620s to ~11s. That was found by accident - a diagnostic step
      # that failed to compile and produced nothing still had the effect, twice, and removing it
      # put the ten minutes straight back. This is the cheap half of what that step did, with no
      # compile to emit spurious errors. If the export times in the log climb back to ~620s,
      # a restore alone isn't enough and the next thing to try is a full publish here.
      - name: Warm the .NET restore
        continue-on-error: true
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          dotnet restore src/ManyWinters.Godot/ManyWinters.Godot.csproj -r win-x64
          "restore took {0:N0}s, exit {1}" -f $sw.Elapsed.TotalSeconds, $LASTEXITCODE

      - name: Export Windows build
        run: |
          $ErrorActionPreference = "Stop"
          $root = (Get-Location).Path
          New-Item -ItemType Directory -Force build/ManyWinters | Out-Null
          $out = Join-Path (Resolve-Path build/ManyWinters).Path "ManyWinters.exe"

          # Start-Process rather than the call operator, so stdout and stderr stay separate and
          # unmangled. Godot reports export failures on stderr and still exits 0, so both matter.
          # It joins ArgumentList with spaces and quotes nothing itself, so every argument has to
          # arrive pre-quoted - otherwise the preset name alone lands as five separate arguments.
          # Nothing Godot prints reaches the Actions log until it exits, since both its streams
          # go to files. Without this the step is a ten-minute black box with no timing at all.
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $godotArgs = @("--headless", "--path", "$root\src\ManyWinters.Godot",
                         "--export-release", $env:EXPORT_PRESET, $out) |
            ForEach-Object { '"' + $_ + '"' }
          $p = Start-Process -FilePath $env:GODOT -NoNewWindow -Wait -PassThru -WorkingDirectory $root `
            -ArgumentList $godotArgs `
            -RedirectStandardOutput "$root\export.out.log" -RedirectStandardError "$root\export.err.log"
          "godot exit code: $($p.ExitCode) after {0:N0}s" -f $sw.Elapsed.TotalSeconds
          Get-Content "$root\export.out.log" -Tail 20
          Get-Content "$root\export.err.log"

          # An exit code of 0 means nothing here: a run that fails to publish any C# at all still
          # writes a launchable .exe and reports success. Check what actually landed on disk.
          if (-not (Test-Path $out)) { throw "Export produced no executable" }
          $data = Get-ChildItem build/ManyWinters -Directory -Filter "data_*" | Select-Object -First 1
          if (-not $data) { throw "No data_* folder: the .NET half of the export never ran" }
          if (-not (Test-Path (Join-Path $data.FullName "ManyWinters.Godot.dll"))) {
            throw "Export is missing ManyWinters.Godot.dll"
          }
          $errs = Select-String -Path "$root\export.out.log", "$root\export.err.log" -Pattern "^ERROR:"
          if ($errs) {
            $errs | ForEach-Object { $_.Line }
            throw "Godot logged $($errs.Count) error(s) during export"
          }
          "Of Folks and Many Winters ${{ steps.version.outputs.version }}",
          "build ${{ steps.version.outputs.tag }}",
          "commit ${{ github.sha }}" | Set-Content build/ManyWinters/version.txt

      - name: Smoke-test the exported build
        run: |
          $ErrorActionPreference = "Stop"
          $root = (Get-Location).Path
          $game = "$root\build\ManyWinters"
          # Boots the real exported game headless for a couple of seconds. An export can load its
          # C# perfectly and still be dead on arrival, because content that resolves under the
          # editor's loose files does not resolve inside a .pck. Running _Ready is the only check
          # that proves the zip is worth handing to anyone.
          $smokeArgs = @("--headless", "--quit-after", "120") | ForEach-Object { '"' + $_ + '"' }
          $p = Start-Process -FilePath "$game\ManyWinters.console.exe" -NoNewWindow -Wait -PassThru `
            -WorkingDirectory $game -ArgumentList $smokeArgs `
            -RedirectStandardOutput "$root\smoke.out.log" -RedirectStandardError "$root\smoke.err.log"
          "smoke exit code: $($p.ExitCode)"
          Get-Content "$root\smoke.out.log" -Tail 20
          Get-Content "$root\smoke.err.log"
          if ($p.ExitCode -ne 0) { throw "The exported build exited with $($p.ExitCode)" }
          $errs = Select-String -Path "$root\smoke.out.log", "$root\smoke.err.log" `
            -Pattern "^ERROR:|Unhandled exception"
          if ($errs) {
            $errs | ForEach-Object { $_.Line }
            throw "The exported build logged $($errs.Count) error(s) on startup"
          }

      - name: Package zip
        run: |
          $ErrorActionPreference = "Stop"
          # Zipping the folder, not its contents, so unpacking doesn't spray files into Downloads.
          7z a -tzip -mx=7 ManyWinters-win64.zip .\build\ManyWinters
          "zip size: {0:N0} MB" -f ((Get-Item ManyWinters-win64.zip).Length / 1MB)

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Of Folks and Many Winters ${{ steps.version.outputs.version }}
          make_latest: "true"
          files: ManyWinters-win64.zip
          body: |
            Automatic alpha build from `main`.

            Download `ManyWinters-win64.zip`, unpack it and run `ManyWinters.exe`.
            Nothing to install — the .NET runtime ships inside. Windows x86-64 only.

            Windows SmartScreen will warn about an unknown publisher; the build is unsigned.
            If the game misbehaves, run `ManyWinters.console.exe` instead and send the output.

            Commit ${{ github.sha }}:

            ```
            ${{ github.event.head_commit.message }}
            ```

      - name: Prune old releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $stale = gh release list --limit 100 --json tagName,createdAt `
            --jq 'sort_by(.createdAt) | reverse | .[10:] | .[].tagName'
          foreach ($tag in $stale) { gh release delete $tag --yes --cleanup-tag }
