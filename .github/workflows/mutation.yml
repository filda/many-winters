name: Mutation Testing

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

# Ubuntu runners are pinned rather than `ubuntu-latest`: that label starts moving to Ubuntu
# 26.04 on 2026-10-19 and warns on every job until it does. 26.04 was rehearsed first - the
# Godot export, the .NET publish and the exported game's headless boot all pass on it. The
# cost of pinning is that this line ages silently and has to be bumped by hand.

jobs:
  check-changes:
    runs-on: ubuntu-26.04
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Scheduled runs skip the (slow) mutation run entirely if src/ hasn't changed in
      # the last day; workflow_dispatch always runs regardless, for a manual check.
      - name: Check for changes in the last day
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || git log --since="24 hours ago" --oneline -- src | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  stryker:
    needs: check-changes
    if: needs.check-changes.outputs.changed == 'true'
    runs-on: ubuntu-26.04
    # Legs are sized to stay well clear of GitHub's 6h hard job cap; a leg that still
    # hangs fails fast and visibly instead of dying silently to a runner-shutdown
    # signal an hour or more later.
    timeout-minutes: 90
    strategy:
      # One job per suite instead of five sequential runs in one job, so a stuck or
      # cancelled suite doesn't take the others down with it and each gets its own
      # runner (disk, memory) rather than accumulating five runs' worth of state.
      fail-fast: false
      matrix:
        include:
          - name: core-continuity-1
            working-directory: src/ManyWinters.Tests
            args: --project ManyWinters.Core.csproj --config-file stryker-config-core-continuity-1.json
          - name: core-continuity-2
            working-directory: src/ManyWinters.Tests
            args: --project ManyWinters.Core.csproj --config-file stryker-config-core-continuity-2.json
          - name: core-continuity-3
            working-directory: src/ManyWinters.Tests
            args: --project ManyWinters.Core.csproj --config-file stryker-config-core-continuity-3.json
          - name: core-other-1
            working-directory: src/ManyWinters.Tests
            args: --project ManyWinters.Core.csproj --config-file stryker-config-core-other-1.json
          - name: core-other-2
            working-directory: src/ManyWinters.Tests
            args: --project ManyWinters.Core.csproj --config-file stryker-config-core-other-2.json
          - name: core-other-3
            working-directory: src/ManyWinters.Tests
            args: --project ManyWinters.Core.csproj --config-file stryker-config-core-other-3.json
          - name: core-other-4
            working-directory: src/ManyWinters.Tests
            args: --project ManyWinters.Core.csproj --config-file stryker-config-core-other-4.json
          - name: core-other-5
            working-directory: src/ManyWinters.Tests
            args: --project ManyWinters.Core.csproj --config-file stryker-config-core-other-5.json
          - name: simulation-runner
            working-directory: src/ManyWinters.Tests
            args: --project ManyWinters.Tools.SimulationRunner.csproj
          # Its own stryker-config.json, because only the presentation layer's extracted
          # calculations are mutated - the rest of ManyWinters.Godot is engine wiring with
          # no tests, which would drown the score in uncovered mutants.
          - name: godot
            working-directory: src/ManyWinters.Godot.Tests
            args: ""
    steps:
      - uses: actions/checkout@v7

      # --with-baseline needs a git ref to diff against, and its target can only be set
      # via this CLI committish (the JSON "baseline"/"since" config keys don't drive it,
      # and are mutually exclusive with each other anyway) - checkout can leave HEAD
      # detached without a local "main" branch, so make sure one exists.
      - name: Ensure local main ref for Stryker baseline diff
        run: git rev-parse --verify main >/dev/null 2>&1 || git branch main ${{ github.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Restore solution
        run: dotnet restore ManyWinters.sln

      # Baseline persists mutant results across nightly runs so unchanged files are
      # skipped instead of fully re-tested - the actual fix for the multi-hour legs.
      # Keyed with a unique suffix so the save step always succeeds (cache keys are
      # immutable); restore-keys falls back to the most recent matching entry.
      - name: Restore Stryker baseline (${{ matrix.name }})
        uses: actions/cache/restore@v4
        with:
          path: ${{ matrix.working-directory }}/StrykerOutput/baseline
          key: stryker-baseline-${{ matrix.name }}-${{ github.run_id }}
          restore-keys: |
            stryker-baseline-${{ matrix.name }}-

      - name: Run Stryker.NET (${{ matrix.name }})
        working-directory: ${{ matrix.working-directory }}
        run: dotnet tool run dotnet-stryker ${{ matrix.args }} --with-baseline:main --version main

      - name: Save Stryker baseline (${{ matrix.name }})
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ matrix.working-directory }}/StrykerOutput/baseline
          key: stryker-baseline-${{ matrix.name }}-${{ github.run_id }}

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report-${{ matrix.name }}
          path: |
            src/ManyWinters.Tests/StrykerOutput/**/reports/
            src/ManyWinters.Godot.Tests/StrykerOutput/**/reports/
