name: Mutation Testing

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

# Ubuntu runners are pinned rather than `ubuntu-latest`: that label starts moving to Ubuntu
# 26.04 on 2026-10-19 and warns on every job until it does. 26.04 was rehearsed first - the
# Godot export, the .NET publish and the exported game's headless boot all pass on it. The
# cost of pinning is that this line ages silently and has to be bumped by hand.

jobs:
  check-changes:
    runs-on: ubuntu-26.04
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Scheduled runs skip the (slow) mutation run entirely if src/ hasn't changed in
      # the last day; workflow_dispatch always runs regardless, for a manual check.
      - name: Check for changes in the last day
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || git log --since="24 hours ago" --oneline -- src | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  stryker:
    needs: check-changes
    if: needs.check-changes.outputs.changed == 'true'
    runs-on: ubuntu-26.04
    strategy:
      # One job per suite instead of five sequential runs in one job, so a stuck or
      # cancelled suite doesn't take the others down with it and each gets its own
      # runner (disk, memory) rather than accumulating five runs' worth of state.
      fail-fast: false
      matrix:
        include:
          - name: core-continuity-1
            working-directory: src/ManyWinters.Tests
            args: --project ManyWinters.Core.csproj --config-file stryker-config-core-continuity-1.json
          - name: core-continuity-2
            working-directory: src/ManyWinters.Tests
            args: --project ManyWinters.Core.csproj --config-file stryker-config-core-continuity-2.json
          - name: core-continuity-3
            working-directory: src/ManyWinters.Tests
            args: --project ManyWinters.Core.csproj --config-file stryker-config-core-continuity-3.json
          - name: core-other-1
            working-directory: src/ManyWinters.Tests
            args: --project ManyWinters.Core.csproj --config-file stryker-config-core-other-1.json
          - name: core-other-2
            working-directory: src/ManyWinters.Tests
            args: --project ManyWinters.Core.csproj --config-file stryker-config-core-other-2.json
          - name: core-other-3
            working-directory: src/ManyWinters.Tests
            args: --project ManyWinters.Core.csproj --config-file stryker-config-core-other-3.json
          - name: simulation-runner
            working-directory: src/ManyWinters.Tests
            args: --project ManyWinters.Tools.SimulationRunner.csproj
          # Its own stryker-config.json, because only the presentation layer's extracted
          # calculations are mutated - the rest of ManyWinters.Godot is engine wiring with
          # no tests, which would drown the score in uncovered mutants.
          - name: godot
            working-directory: src/ManyWinters.Godot.Tests
            args: ""
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Restore solution
        run: dotnet restore ManyWinters.sln

      - name: Run Stryker.NET (${{ matrix.name }})
        working-directory: ${{ matrix.working-directory }}
        run: dotnet tool run dotnet-stryker ${{ matrix.args }}

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report-${{ matrix.name }}
          path: |
            src/ManyWinters.Tests/StrykerOutput/**/reports/
            src/ManyWinters.Godot.Tests/StrykerOutput/**/reports/
